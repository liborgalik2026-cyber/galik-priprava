function buildTeamTableData(ms, L, isOwn) {
  var g = {};
  ms.forEach(m => {
    var ti = isOwn ? side(m) : 1 - side(m);
    var sk = ti ? 'a' : 'h';
    var pl = (m.pl && m.pl[sk]) || {};
    var lb = (m.lb && m.lb[sk]) || {};
    var sz = (m.sz && m.sz[sk]) || {};
    Object.keys(pl).forEach(numStr => {
      var num = +numStr;
      var name = pl[num];
      if (!name) return;
      if (!g[name]) g[name] = { p: num, l: [], lb: !!lb[num], sz: ms.length === 1 ? (sz[num] || []) : [] };
    });
  });
  L.forEach(e => {
    var n = pname(e);
    if (!g[n]) g[n] = { p: e.p, l: [], lb: false, sz: [] };
    g[n].l.push(e);
  });
  var ks = Object.keys(g).sort((x, y) => g[x].p - g[y].p);
  var fmtBox = (v) => v ? '<span class="st-box">' + esc(v) + '</span>' : '<span class="st-box empty">.</span>';
  
  return ks.map(k => {
    var c = cnt(g[k].l);
    var zArr = g[k].sz || [];
    c.s1 = fmtBox(zArr[0]);
    c.s2 = fmtBox(zArr[1]);
    c.s3 = fmtBox(zArr[2]);
    c.s4 = fmtBox(zArr[3]);
    c.s5 = fmtBox(zArr[4]);
    var numDisp = g[k].p + (g[k].lb ? ' <b>L</b>' : '');
    return [numDisp, k, c, '', { p: k, o: isOwn }];
  });
}

function vBk(){
  $('v').innerHTML='<div class="card"><h2>NADPIS APLIKACE</h2><input value="'+esc(S.team)+'" onchange="S.team=this.value||\'Gálík příprava\';sv();$(\'ttl\').textContent=S.team.toUpperCase()"></div>'+
  '<div class="card"><h2>MOJE DRUŽSTVO V SOUBORECH DATAVOLLEY</h2><p class="mut">Napiš název tak, jak je v souborech (stačí část, např. Dukla). U nově nahraných utkání se podle toho sama nastaví tvoje strana.</p><input value="'+esc(S.my)+'" placeholder="např. Dukla Liberec" onchange="S.my=this.value.trim();sv()"><div class="row" style="margin-top:8px"><button class="btn pri" onclick="var c=0;S.m.forEach(function(m){if(autoMine(m))c++});sv();$(\'am\').textContent=\'Nastaveno u \'+c+\' z \'+S.m.length+\' utkání\'">POUŽÍT U VŠECH UTKÁNÍ</button><span class="ok" id="am"></span></div></div>'+
  '<div class="card"><h2>ZÁLOHA DAT</h2><p class="mut">Data jsou jen v tomto prohlížeči. Zkopíruj text a ulož ho do souboru nebo e-mailu. U více utkání může být dlouhý.</p><textarea id="ex" readonly>'+esc(JSON.stringify(S))+'</textarea><div class="row" style="margin-top:8px"><button class="btn pri" onclick="cp()">KOPÍROVAT ZÁLOHU</button><span class="ok" id="cm"></span></div></div>'+
  '<div class="card"><h2>OBNOVIT ZE ZÁLOHY</h2><textarea id="im" placeholder="Vlož sem zálohu…"></textarea><div class="row" style="margin-top:8px"><button class="btn" onclick="rst()">OBNOVIT (PŘEPÍŠE DATA)</button><span id="im2"></span></div></div>'+
  '<div class="card"><h2>SMAZAT VŠE</h2><button class="btn dg" onclick="wipe()">'+(armed==='all'?'OPRAVDU SMAZAT VŠECHNA UTKÁNÍ?':'SMAZAT VŠECHNA UTKÁNÍ')+'</button></div>';
}
function cp(){var t=$('ex');t.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}try{if(navigator.clipboard){navigator.clipboard.writeText(t.value);ok=true}}catch(e){}$('cm').textContent=ok?'Zkopírováno':'Označeno – zkopíruj ručně'}
function rst(){try{var x=JSON.parse($('im').value);if(!x||!Array.isArray(x.m))throw 0;S=x;sv();$('ttl').textContent=S.team.toUpperCase();$('im2').className='ok';$('im2').textContent='Obnoveno ('+S.m.length+' utkání)'}catch(e){$('im2').className='er';$('im2').textContent='Záloha není platná'}}
function wipe(){if(armed!=='all'){armed='all';vBk();return}S.m=[];sv();go('list')}

</script>
<script>
try{ld()}catch(e){showErr("ld(): "+e.message)}
try{draw()}catch(e){showErr("draw(): "+e.message)}
</script>
</body>
</html>
